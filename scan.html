<!-- DDH staff gate: passcode is verified by the Apps Script backend (never stored in this page) -->
<script id="ddh-gate">
(function(){
  var API='https://script.google.com/macros/s/AKfycbzb14Vn7TQ3OXN3qzRVSqMyeqjIksF0415J4Ae4GFUQzxVwaM4nINZUt47bnsp1wdQA/exec',K='ddh_staff_pass';
  function get(){try{return sessionStorage.getItem(K)||''}catch(e){return ''}}
  function put(v){try{v?sessionStorage.setItem(K,v):sessionStorage.removeItem(K)}catch(e){}}
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var isApi=String(u&&u.url||u).indexOf('script.google.com/macros/s/')>-1;
    try{if(isApi&&o&&typeof o.body==='string'&&get()){var b=JSON.parse(o.body);if(!b.pass){b.pass=get();o=Object.assign({},o,{body:JSON.stringify(b)});}}}catch(e){}
    return of(u,o).then(function(r){
      if(isApi){r.clone().text().then(function(t){if(t.indexOf('"unauthorized":true')>-1){put('');show('Session expired — enter the passcode again.');}}).catch(function(){});}
      return r;});
  };
  var box;
  function show(msg){
    if(box&&box.parentNode){if(msg)box.querySelector('.m').textContent=msg;return;}
    box=document.createElement('div');
    box.style.cssText='position:fixed;inset:0;z-index:99999;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:"Tenor Sans",Arial,sans-serif';
    box.innerHTML='<form style="max-width:340px;width:100%;text-align:center;color:#F4EEE4"><img src="/Main%20images/DD%20-%20Logo%20Black%20(for%20web).png" alt="Design District Hyd" style="height:70px;margin:0 auto 1.4rem;filter:invert(1)"><div style="font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:#7AADA8;margin-bottom:1.2rem">Team access</div><input type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" style="width:100%;background:transparent;border:0;border-bottom:1px solid rgba(244,238,228,.4);color:#F4EEE4;font-size:1.1rem;padding:.7rem 0;text-align:center;outline:0"><button type="submit" style="margin-top:1.4rem;width:100%;background:#7AADA8;color:#0A0A0A;border:0;padding:.95rem;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;cursor:pointer">Enter</button><div class="m" style="min-height:1.2rem;margin-top:1rem;font-size:.7rem;color:#e08a7a">'+(msg||'')+'</div></form>';
    (document.body||document.documentElement).appendChild(box);
    var f=box.querySelector('form'),i=box.querySelector('input'),m=box.querySelector('.m'),b=box.querySelector('button');
    setTimeout(function(){i.focus()},50);
    f.onsubmit=function(e){e.preventDefault();var v=i.value;if(!v)return;b.disabled=true;m.textContent='';
      of(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'verifyPasscode',pass:v}),redirect:'follow'})
       .then(function(r){return r.text()}).then(function(t){var o=JSON.parse(t);if(o.success){put(v);box.remove();location.reload();}else{m.textContent=o.message||'Wrong passcode';b.disabled=false;i.select();}})
       .catch(function(){m.textContent='Could not reach the server — try again.';b.disabled=false;});};
  }
  function init(){if(!get())show('');}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:      #0A0A0A;
  --teal:       #7AADA8;
  --teal-dark:  #4E8A85;
  --cream:      #F4EEE4;
  --warm-white: #FAF7F2;
  --terracotta: #C67B52;
  --gold:       #C4A35A;
  --muted:      #8A8070;
  --green-dark: #1B5E20;
  --green:      #2E7D32;
  --red-dark:   #7f1d1d;
  --red:        #991b1b;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--black);
  color: var(--cream);
  min-height: 100vh;
  padding-bottom: 2rem;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--teal-dark), var(--teal));
  padding: 1rem;
  text-align: center;
}
.header h1 { font-size: 1.2rem; font-weight: 700; color: var(--black); letter-spacing: 0.05em; }
.header .subtitle { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(10,10,10,0.65); }

/* ── Live headcount bar ── */
.headcount-bar {
  display: flex;
  background: var(--warm-white);
  padding: 0.8rem 1rem;
}
.hc-item { flex: 1; text-align: center; }
.hc-num  { font-size: 1.8rem; font-weight: 900; color: var(--teal-dark); line-height: 1; }
.hc-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 2px; }

/* ── Main container ── */
.main { max-width: 480px; margin: 0 auto; padding: 1rem; }

/* ── Result card (overlays top of scanner area) ── */
.result-card {
  border-radius: 16px;
  padding: 1.2rem 1.5rem;
  text-align: center;
  margin-bottom: 1rem;
  display: none;
  animation: slideDown 0.25s ease;
}
.result-card.show { display: block; }
.result-card.success  { background: linear-gradient(135deg, var(--green-dark), var(--green));  border: 2px solid #4CAF50; }
.result-card.error    { background: linear-gradient(135deg, var(--red-dark),   var(--red));    border: 2px solid #EF5350; }
.result-card.already  { background: linear-gradient(135deg, #78350f, #92400e); border: 2px solid var(--gold); }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.result-icon { font-size: 2.5rem; margin-bottom: 0.4rem; }
.result-name { font-size: 1.4rem; font-weight: 800; color: #fff; }
.result-id   { font-size: 0.9rem; color: rgba(255,255,255,0.7); margin: 0.2rem 0; }
.result-area { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
.result-msg  { font-size: 0.75rem; color: rgba(255,255,255,0.8); margin-top: 0.4rem; font-style: italic; }

/* ── Camera viewfinder ── */
.viewfinder-wrap { position: relative; margin-bottom: 0.8rem; }

#reader { width: 100%; border-radius: 12px; overflow: hidden; border: 3px solid var(--teal); }

/* fix html5-qrcode injected styles */
#reader video { border-radius: 0 !important; }
#reader__scan_region { border-radius: 0 !important; }
#reader__header_message { display: none !important; }
#reader__status_span { display: none !important; }
#reader__camera_selection { 
  width: 100%; padding: 0.5rem; background: rgba(255,255,255,0.1);
  color: var(--cream); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; font-size: 0.85rem; margin-bottom: 0.5rem;
}

/* ── Scan / Stop button ── */
.scan-toggle {
  width: 100%; padding: 1rem; border-radius: 12px; border: none;
  font-size: 1rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; cursor: pointer; margin-bottom: 0.8rem; transition: all 0.2s;
}
.scan-toggle.start { background: var(--teal);       color: var(--black); }
.scan-toggle.stop  { background: var(--terracotta); color: #fff; }
.scan-toggle:active { transform: scale(0.98); }
.scan-toggle:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Divider ── */
.divider {
  display: flex; align-items: center; gap: 1rem;
  color: var(--muted); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.1em; margin: 1rem 0;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.12);
}

/* ── Manual search ── */
.manual-section {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem;
}
.section-title {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted); margin-bottom: 0.8rem;
}
.input-row { display: flex; gap: 0.5rem; }
.manual-input {
  flex: 1; padding: 0.8rem; border-radius: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15); color: var(--cream); font-size: 1rem;
  outline: none; transition: border-color 0.2s;
}
.manual-input:focus { border-color: var(--teal); }
.manual-input::placeholder { color: var(--muted); }
.go-btn {
  padding: 0.8rem 1.2rem; background: var(--teal); color: var(--black);
  border: none; border-radius: 8px; font-weight: 700; font-size: 0.85rem;
  text-transform: uppercase; cursor: pointer; white-space: nowrap;
}
.go-btn:active { transform: scale(0.97); }

/* ── Scan history ── */
.history-section {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 1.2rem;
}
.scan-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.07);
}
.scan-item:last-child { border-bottom: none; }
.si-name { font-size: 0.9rem; font-weight: 600; }
.si-sub  { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
.si-badge {
  font-size: 0.65rem; font-weight: 700; padding: 0.25rem 0.6rem;
  border-radius: 8px; text-transform: uppercase; white-space: nowrap;
}
.si-badge.ok  { background: rgba(76,175,80,0.2);  color: #4CAF50; }
.si-badge.dup { background: rgba(196,163,90,0.2); color: var(--gold); }
.si-badge.err { background: rgba(198,123,82,0.2); color: var(--terracotta); }

.empty-history { font-size: 0.8rem; color: var(--muted); text-align: center; padding: 1rem 0; }
</style>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzb14Vn7TQ3OXN3qzRVSqMyeqjIksF0415J4Ae4GFUQzxVwaM4nINZUt47bnsp1wdQA/exec';

let html5QrCode   = null;
let scanning      = false;
let lastScanned   = '';
let lastScannedAt = 0;
let scanHistory   = [];
let busy          = false;

// ── API ────────────────────────────────────
const REQUEST_TIMEOUT_MS = 20000;

class ApiError extends Error {
  constructor(kind, message) { super(message); this.kind = kind; }
}

async function callAPI(payload) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  let res, text;
  try {
    res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow',
      signal: ctrl.signal
    });
    text = await res.text();
  } catch (e) {
    throw new ApiError('network',
      e.name === 'AbortError' ? 'Server took too long to respond — try again'
                              : 'Could not reach server — check your internet');
  } finally {
    clearTimeout(timer);
  }

  try {
    return JSON.parse(text);
  } catch (e) {
    // Apps Script returns an HTML page when the script crashes, isn't deployed
    // for "Anyone", or the action doesn't exist. Surface that text so the real
    // cause is visible instead of a generic "Connection Error".
    const snippet = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
    console.error('Non-JSON reply from Apps Script (HTTP ' + res.status + '):', text.slice(0, 800));
    throw new ApiError('server', 'Server error: ' + (snippet || 'empty reply (HTTP ' + res.status + ')'));
  }
}

// ── Scanner toggle ─────────────────────────
async function toggleScanner() {
  scanning ? await stopScanner() : await startScanner();
}

async function startScanner() {
  const btn = document.getElementById('scanToggle');
  btn.disabled = true;
  btn.textContent = 'Starting camera...';

  if (typeof Html5Qrcode === 'undefined') {
    btn.className = 'scan-toggle start';
    btn.textContent = '▶ Start Camera Scanner';
    btn.disabled = false;
    showResult('error', '📷', 'Scanner not loaded', '', '', 'Camera library failed to load — check internet and reload the page');
    return;
  }
  html5QrCode = new Html5Qrcode('reader');

  try {
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onQRDetected,
      () => {} // silent per-frame non-match errors
    );
    scanning = true;
    btn.className   = 'scan-toggle stop';
    btn.textContent = '⏹ Stop Scanner';
  } catch (err) {
    html5QrCode = null;
    btn.className   = 'scan-toggle start';
    btn.textContent = '▶ Start Camera Scanner';
    showResult('error', '📷', 'Camera Error', '', '', 'Tap Allow when asked for camera access, then try again');
  }
  btn.disabled = false;
}

async function stopScanner() {
  const btn = document.getElementById('scanToggle');
  scanning = false;
  if (html5QrCode) {
    try { await html5QrCode.stop(); html5QrCode.clear(); } catch(e) {}
    html5QrCode = null;
  }
  btn.className   = 'scan-toggle start';
  btn.textContent = '▶ Start Camera Scanner';
}

// ── QR detected ────────────────────────────
async function onQRDetected(text) {
  const now = Date.now();
  // Debounce: ignore same code within 5 seconds
  if (text === lastScanned && now - lastScannedAt < 5000) return;
  if (busy) return;
  lastScanned   = text;
  lastScannedAt = now;

  await processEntry(text);
}

// ── Manual input ───────────────────────────
document.getElementById('manualInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') manualLookup();
});

function manualLookup() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  document.getElementById('manualInput').value = '';
  processEntry(val);
}

// ── Work out what a QR / typed value is ────
// Accepts: a bare ID (DDH-S3-XXXX), a 10-digit phone, or a pass URL such as
// https://…/pass.html?reg=DDH-S3-XXXX that the pass page may have encoded.
function parseScanValue(raw) {
  const text = String(raw || '').trim();
  if (!text) return null;

  const idMatch = text.match(/DDH-S3-[A-Z0-9-]+/i);
  if (idMatch) return { action: 'scanById', value: idMatch[0].toUpperCase() };

  if (/^[\d\s+\-()]+$/.test(text)) {
    const digits = text.replace(/\D/g, '');
    if (digits.length >= 10) return { action: 'scanByPhone', value: digits.slice(-10) };
  }

  try {
    const u = new URL(text);
    const reg = u.searchParams.get('reg') || u.searchParams.get('id');
    if (reg) return { action: 'scanById', value: reg.trim().toUpperCase() };
    const ph = (u.searchParams.get('phone') || '').replace(/\D/g, '');
    if (ph.length >= 10) return { action: 'scanByPhone', value: ph.slice(-10) };
  } catch (e) { /* not a URL */ }

  return null;
}

// ── Core entry logic ───────────────────────
async function processEntry(raw) {
  const parsed = parseScanValue(raw);
  if (!parsed) {
    lastScanned = '';
    showResult('error', '✗', 'Invalid Input', '', '', `"${String(raw).slice(0, 60)}" is not a valid ID or phone number`);
    return;
  }

  busy = true;
  try {
    const result = await callAPI({ action: parsed.action, value: parsed.value });
    const v = result && result.data;

    if (result && result.success) {
      const isNew = !v || v.type !== 'Returning';
      showResult(
        'success', '✓',
        (v && v.name) || parsed.value,
        `${(v && v.id) || parsed.value}  ·  ${isNew ? '✨ New' : '🎉 Returning'}`,
        (v && v.area) || '',
        'Entry confirmed — welcome!'
      );
      addHistory((v && v.name) || parsed.value, (v && v.id) || parsed.value, 'ok');
      refreshStats();
    } else if (result && result.message === 'Already scanned in') {
      showResult('already', '⚠️', v?.name || '—', v?.id || parsed.value, v?.area || '', 'Already entered — duplicate scan');
      addHistory(v?.name || parsed.value, v?.id || '—', 'dup');
    } else {
      lastScanned = ''; // allow an immediate re-scan after a miss
      showResult('error', '✗', 'Not Found', '', parsed.value, (result && result.message) || 'No matching registration');
      addHistory(parsed.value, '—', 'err');
    }
  } catch (err) {
    console.error(err);
    lastScanned = ''; // let the volunteer retry the same QR straight away
    const title = err.kind === 'server' ? 'Server Error' : 'Connection Error';
    showResult('error', '✗', title, '', parsed.value, err.message || 'Something went wrong — try again');
  } finally {
    busy = false;
  }
}

// ── Result display ─────────────────────────
let resultTimer;
function showResult(type, icon, name, id, area, msg) {
  const card = document.getElementById('resultCard');
  card.className = `result-card show ${type}`;
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultName').textContent = name;
  document.getElementById('resultId').textContent   = id;
  document.getElementById('resultArea').textContent = area;
  document.getElementById('resultMsg').textContent  = msg;

  clearTimeout(resultTimer);
  resultTimer = setTimeout(() => { card.classList.remove('show'); }, 5000);
}

// ── History ────────────────────────────────
function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addHistory(name, id, status) {
  const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
  scanHistory.unshift({ name, id, time, status });
  if (scanHistory.length > 12) scanHistory.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('scanHistory');
  if (!scanHistory.length) {
    el.innerHTML = '<div class="empty-history">No scans yet</div>';
    return;
  }
  el.innerHTML = scanHistory.map(s => `
    <div class="scan-item">
      <div>
        <div class="si-name">${esc(s.name)}</div>
        <div class="si-sub">${esc(s.id)} &middot; ${esc(s.time)}</div>
      </div>
      <span class="si-badge ${s.status}">${s.status === 'ok' ? '✓ In' : s.status === 'dup' ? '⚠ Dup' : '✗ Err'}</span>
    </div>`).join('');
}

// ── Live stats ─────────────────────────────
async function refreshStats() {
  try {
    const r = await callAPI({ action: 'getStats' });
    if (r?.success && r.data) {
      document.getElementById('hcRegistered').textContent = r.data.total   ?? '—';
      document.getElementById('hcEntered').textContent    = r.data.scanned ?? '—';
      document.getElementById('hcNew').textContent        = r.data.new     ?? '—';
    }
  } catch(e) {}
}

// ── Init ───────────────────────────────────
refreshStats();
setInterval(refreshStats, 30000);
try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen'); } catch(e) {}
</script>
